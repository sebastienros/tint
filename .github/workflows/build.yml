name: Build

permissions:
  contents: read

on:
  workflow_dispatch:

  push:
    branches: [ main ]
    paths-ignore:
    - 'docs/**'
    - '**/*.md'

  pull_request:
    branches: [ main ]
    paths-ignore:
    - 'docs/**'
    - '**/*.md'

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        NUGET_PACKAGES: ${{ matrix.os == 'ubuntu-latest' && '/mnt/nuget/packages' || format('{0}/.nuget/packages', github.workspace) }}
        NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.nuget/http-cache
        NUGET_SCRATCH: ${{ github.workspace }}/.nuget/scratch
        NUGET_PLUGINS_CACHE_PATH: ${{ github.workspace }}/.nuget/plugins

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Prepare Linux NuGet package directory
      if: runner.os == 'Linux'
      shell: bash
      run: sudo install -d -o "$(id -u)" -g "$(id -g)" "$NUGET_PACKAGES"
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: |
          10.0.x
        global-json-file: global.json
        check-latest: false
    - name: Restore
      run: dotnet restore Tint.slnx -p:Configuration=Release -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True
    - name: Build
      run: dotnet build Tint.slnx --configuration Release --no-restore -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True
    - name: Test
      run: dotnet test --solution Tint.slnx --configuration Release --no-build --minimum-expected-tests 1
    - name: Run the generator sample
      run: dotnet run --project test/Tint.Generator.Sample/Tint.Generator.Sample.csproj --configuration Release --no-build
    # dotnet format loads the Debug configuration, where the sample needs the generator's Debug build to see the
    # generated attributes and classes.
    - name: Build the generator for dotnet format
      run: dotnet build src/Tint.Generator/Tint.Generator.csproj --no-restore
    - name: Check formatting
      run: dotnet format Tint.slnx --severity warn --verify-no-changes --no-restore

    - name: Pack preview packages
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        set -euo pipefail
        for project in src/Tint/Tint.csproj src/Tint.Grammars/Tint.Grammars.csproj src/Tint.Themes/Tint.Themes.csproj; do
          dotnet pack "$project" --output artifacts --configuration Release --no-build -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True
        done

    - name: Push preview packages to Feedz
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
      shell: bash
      env:
        FEEDZ_IO_API_KEY: ${{ secrets.FEEDZ_IO_API_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "$FEEDZ_IO_API_KEY" ]]; then
          echo "Feedz publishing skipped: FEEDZ_IO_API_KEY is not configured."
          exit 0
        fi
        for package in artifacts/*.nupkg; do
          dotnet nuget push "$package" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/tint/nuget/index.json --skip-duplicate
        done

  # The solution build above covers the playground too; this job keeps a plain Release build of it visible as its own
  # check. It needs no workload: AOT (TintPlaygroundAot=true) is only for the Pages deployment (pages.yml).
  playground:
    name: Playground
    runs-on: ubuntu-latest
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: |
          10.0.x
        global-json-file: global.json
        check-latest: false
    - name: Build the playground
      run: dotnet build samples/Tint.Playground -c Release
