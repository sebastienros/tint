name: Sync VS Code grammars and themes

# Keeps grammars/ and themes/ (and the generated THIRD-PARTY-NOTICES.txt and bundle item lists) in sync with
# microsoft/vscode. When anything changed, the run force-updates the single long-lived
# branch `sync/vscode` and creates or updates the pull request from it, so there is never
# more than one open sync pull request.

permissions:
  contents: read

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC

  workflow_dispatch:
    inputs:
      ref:
        description: The microsoft/vscode commit, branch or tag to sync from.
        required: false
        default: main

concurrency:
  group: sync-vscode
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  SYNC_BRANCH: sync/vscode
  SYNC_LABEL: vscode-sync
  BASE_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Check sync App configuration
      shell: bash
      env:
        SYNC_APP_ID: ${{ vars.SYNC_APP_ID }}
        SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "$SYNC_APP_ID" || -z "$SYNC_APP_PRIVATE_KEY" ]]; then
          echo "::error::Configure SYNC_APP_ID and SYNC_APP_PRIVATE_KEY as described in docs/release.md before running the sync."
          exit 1
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          10.0.x
        global-json-file: global.json

    - name: Sync grammars and themes
      id: sync
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SYNC_REF: ${{ github.event.inputs.ref || 'main' }}
      run: |
        set -euo pipefail
        previous="$(jq -r '.commit' grammars/manifest.json)"
        dotnet run --project tools/Tint.Sync -c Release -- sync --commit "$SYNC_REF" | tee sync.log
        resolved="$(sed -n 's/^resolved: //p' sync.log | tail -n 1)"
        if [[ ! "$resolved" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Tint.Sync did not print a resolved commit."
          exit 1
        fi
        rm -f sync.log
        {
          echo "previous=$previous"
          echo "resolved=$resolved"
          echo "short=${resolved:0:8}"
        } >> "$GITHUB_OUTPUT"

    - name: Detect changes
      id: changes
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "$(git status --porcelain -- grammars themes THIRD-PARTY-NOTICES.txt src/Tint.Grammars/VSCodeGrammars.props src/Tint.Themes/VSCodeThemes.props src/Tint.Grammars.Sources/build src/Tint.Themes.Sources/build src/Tint.Generator/VSCodeScopes.cs)" ]]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "grammars/ and themes/ already match microsoft/vscode@${{ steps.sync.outputs.short }}."
        fi

    # Mint after generation so restore/sync time does not consume the token's lifetime.
    - name: Create sync App token
      id: app-token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
      with:
        app-id: ${{ vars.SYNC_APP_ID }}
        private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write

    - name: Create or update the sync pull request
      if: steps.changes.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_REPO: ${{ github.repository }}
        PREVIOUS: ${{ steps.sync.outputs.previous }}
        RESOLVED: ${{ steps.sync.outputs.resolved }}
        SHORT: ${{ steps.sync.outputs.short }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        git add -A -- grammars themes THIRD-PARTY-NOTICES.txt src/Tint.Grammars/VSCodeGrammars.props src/Tint.Themes/VSCodeThemes.props src/Tint.Grammars.Sources/build src/Tint.Themes.Sources/build src/Tint.Generator/VSCodeScopes.cs

        # Count grammar and theme files by change kind from the staged diff.
        count() { git diff --cached --name-status --diff-filter="$1" -- grammars themes | wc -l | tr -d ' '; }
        added="$(count A)"
        modified="$(count M)"
        removed="$(count D)"

        title="Sync grammars and themes with microsoft/vscode@${SHORT}"
        body="$(cat <<EOF
        Automated sync of \`grammars/\`, \`themes/\`, \`THIRD-PARTY-NOTICES.txt\` and the bundle item lists (\`src/Tint.Grammars/VSCodeGrammars.props\`, \`src/Tint.Themes/VSCodeThemes.props\`) from [microsoft/vscode](https://github.com/microsoft/vscode) by \`tools/Tint.Sync\`.

        | | Commit |
        | --- | --- |
        | Previous | \`${PREVIOUS}\` |
        | New | \`${RESOLVED}\` |

        Upstream changes: https://github.com/microsoft/vscode/compare/${PREVIOUS}...${RESOLVED}

        Grammar and theme files: ${added} added, ${modified} modified, ${removed} removed.

        The GitHub App opens and updates this pull request so the normal Build and AOT workflows start automatically. Review the checks for the latest head before merging.

        Generated by [this run](${RUN_URL}). The branch \`${SYNC_BRANCH}\` is force-updated by every run that finds changes; do not push to it by hand.
        EOF
        )"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "$SYNC_BRANCH"
        git commit -m "$title" -m "Upstream changes: https://github.com/microsoft/vscode/compare/${PREVIOUS}...${RESOLVED}"
        gh auth setup-git
        git push --force --set-upstream origin "$SYNC_BRANCH"

        gh label create "$SYNC_LABEL" --force --color 0e8a16 --description "Automated sync of grammars and themes from microsoft/vscode"

        existing="$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
        if [[ -n "$existing" ]]; then
          gh pr edit "$existing" --title "$title" --body "$body" --add-label "$SYNC_LABEL"
          echo "Updated pull request #${existing}."
        else
          gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --title "$title" --body "$body" --label "$SYNC_LABEL"
        fi

    - name: Close a stale sync pull request
      if: steps.changes.outputs.changed == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_REPO: ${{ github.repository }}
        SHORT: ${{ steps.sync.outputs.short }}
      run: |
        set -euo pipefail
        existing="$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
        if [[ -n "$existing" ]]; then
          gh pr close "$existing" --delete-branch --comment "Closing: \`${BASE_BRANCH}\` already matches microsoft/vscode@${SHORT}."
        fi
