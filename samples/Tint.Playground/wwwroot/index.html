<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tint playground</title>
    <meta name="description" content="Try Tint, the TextMate syntax colorizer for .NET, in the browser: every VS Code grammar and theme, compiled to WebAssembly." />
    <base href="/" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <script>performance.mark('tint-start');</script>
</head>

<body>
    <div id="app">
        <div class="loading">Loading the playground…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
